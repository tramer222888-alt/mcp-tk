name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install -g https://github.com/tramer222888-alt/mcp-tk/archive/refs/heads/main.tar.gz
      - run: node test/install-smoke.mjs
        env:
          MCP_TK_COMMAND: mcp-tk

  install-smoke-windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install -g .
      - name: MCP handshake through cmd.exe
        run: node test/install-smoke.mjs
        env:
          MCP_TK_COMMAND: cmd.exe
          MCP_TK_ARGS: '["/d","/s","/c","mcp-tk"]'

  live-smoke:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[live-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run smoke
