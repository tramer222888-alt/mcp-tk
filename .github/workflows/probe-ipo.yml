name: Probe IPO

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Reproduce official IPO searches over HTTP/2
        run: |
          set -u
          BASE='https://ipo.trybunal.gov.pl/ipo'
          UA='mcp-tk-probe/0.3 (public compatibility test)'
          open_session() {
            local p="$1"
            curl -fsS --http2 --compressed --max-time 60 -c "$p.cookies" -b "$p.cookies"               -H "User-Agent: $UA" -H 'Accept: text/html,application/xhtml+xml'               -o "$p.landing.html" "$BASE/"
            curl -fsS --http2 --compressed --max-time 60 -c "$p.cookies" -b "$p.cookies"               -H "User-Agent: $UA" -H 'Accept: text/html,application/xhtml+xml'               -o "$p.search.html" "$BASE/Szukaj?cid=1"
            python3 - "$p" <<'PY'
          import html,re,sys
          from pathlib import Path
          p=sys.argv[1]
          text=Path(p+".search.html").read_text(encoding="utf-8",errors="replace")
          m=re.search(r'name="javax\.faces\.ViewState"[^>]+value="([^"]+)"',text,re.I)
          if not m: raise SystemExit("no ViewState")
          Path(p+".state").write_text(html.unescape(m.group(1)),encoding="utf-8")
          for ident in ("wyszukiwanie:tabView:dataOd_input","wyszukiwanie:tabView:dataDo_input"):
              pos=text.find('id="'+ident+'"')
              print("CALENDAR",ident,text[max(0,pos-300):pos+1500].replace("\n"," ") if pos>=0 else "MISSING")
          PY
          }
          post_search() {
            local p="$1" source="$2" active="$3" field="$4" value="$5"
            local state
            state="$(cat "$p.state")"
            curl -sS --http2 --compressed --max-time 180 -c "$p.cookies" -b "$p.cookies"               -H "User-Agent: $UA" -H 'Accept: application/xml, text/xml, */*; q=0.01'               -H 'Content-Type: application/x-www-form-urlencoded; charset=UTF-8'               -H 'Faces-Request: partial/ajax' -H 'X-Requested-With: XMLHttpRequest'               -H "Referer: $BASE/Szukaj?cid=1"               --data-urlencode 'javax.faces.partial.ajax=true'               --data-urlencode "javax.faces.source=$source"               --data-urlencode 'javax.faces.partial.execute=wyszukiwanie'               --data-urlencode 'javax.faces.partial.render=wyszukiwanie filtr'               --data-urlencode "$source=$source"               --data-urlencode 'wyszukiwanie=wyszukiwanie'               --data-urlencode "$field=$value"               --data-urlencode 'wyszukiwanie:tabView:gdzieSzukaj_1_input=wyrok'               --data-urlencode 'wyszukiwanie:tabView:odmianaSlow_1_input=on'               --data-urlencode "wyszukiwanie:tabView_activeIndex=$active"               --data-urlencode "javax.faces.ViewState=$state"               -w '%{http_code} %{time_total}\n' -o "$p.ajax.xml" "$BASE/Szukaj?cid=1"
            echo "post-exit=$?"
            curl -sS --http2 --compressed --max-time 60 -c "$p.cookies" -b "$p.cookies"               -H "User-Agent: $UA" -H 'Accept: text/html,application/xhtml+xml'               -w '%{http_code} %{time_total}\n' -o "$p.print.html" "$BASE/SzukajDrukuj?cid=1&page=0"
          }

          open_session signature
          post_search signature 'wyszukiwanie:tabView:szukaj_button_tab2' 1             'wyszukiwanie:tabView:sygnaturaComplete_input' 'K 23/11'

          open_session query
          post_search query 'wyszukiwanie:tabView:szukaj_button_tab1' 0             'wyszukiwanie:tabView:szukajFrazaIT_1_input' 'kontrasygnata'

          python3 - <<'PY'
          import html,re
          from pathlib import Path
          for p in ("signature","query"):
              for suffix in ("ajax.xml","print.html"):
                  path=Path(p+"."+suffix)
                  if not path.exists():
                      print("MISSING",path)
              if not Path(p+".print.html").exists(): continue
              ajax=Path(p+".ajax.xml").read_text(encoding="utf-8",errors="replace") if Path(p+".ajax.xml").exists() else ""
              page=Path(p+".print.html").read_text(encoding="utf-8",errors="replace")
              rows=re.findall(r'<span class="sygnatura">([^<]+)</span>',page,re.I)
              pager=re.search(r'Strona wyników:\s*(\d+)\s*z\s*(\d+)',page,re.I)
              print("\nRESULT",p,"ajax-bytes",len(ajax),"page-bytes",len(page),
                    "rows",len(rows),"pager",pager.groups() if pager else None)
              print("signatures",[html.unescape(x).strip() for x in rows[:25]])
              print("ajax-head",ajax[:1500].replace("\n"," "))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipo-search-probe
          path: |
            *.ajax.xml
            *.print.html
          retention-days: 1
