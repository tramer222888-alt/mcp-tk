name: Probe official OTK ZU search

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect search form and result rows
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (compatible; mcp-tk/1.0; public compatibility test)'
          BASE='https://otkzu.trybunal.gov.pl'
          curl -fsS --http2 --compressed --max-time 45 -L -c cookies -b cookies             -H "User-Agent: $UA" -H 'Accept: text/html,application/xhtml+xml'             -o search.html "$BASE/Wyszukiwanie"
          python3 - <<'PY'
          import html,re
          from pathlib import Path
          s=Path("search.html").read_text("utf-8",errors="replace")
          form=re.search(r'<form[^>]+id="wyszukiwanie"[^>]*>(.*?)</form>',s,re.I|re.S)
          if not form: raise SystemExit("missing search form")
          f=form.group(1)
          print("FORM OPEN",s[s.rfind("<form",0,form.start(1)):form.start(1)].replace("\n"," "))
          for tag in re.findall(r'<(?:input|select|button|textarea)\b[^>]*>',f,re.I):
              name=re.search(r'\b(?:name|id)="([^"]+)"',tag,re.I)
              if name:
                  print("CONTROL",html.unescape(name.group(1)),tag[:1000].replace("\n"," "))
          for label in ("Fraza","Sygnatura","szukaj","Szukaj","dataTable"):
              pos=f.find(label)
              print("\nAROUND",label,f[max(0,pos-800):pos+2400].replace("\n"," ") if pos>=0 else "MISSING")
          row=re.search(r'<a[^>]+href="/2026/A/97"[^>]*>',s,re.I)
          if row:
              start=max(0,row.start()-2500)
              print("\nFIRST ROW",s[start:row.start()+6000].replace("\n"," "))
          print("\nAJAX SCRIPTS")
          for x in re.findall(r'PrimeFaces\.ab\(\{[^}]{1,1500}\}\)',f,re.I):
              print(html.unescape(x))
          PY
